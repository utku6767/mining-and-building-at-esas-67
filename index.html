<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; cursor: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before { width: 2px; height: 16px; left: 7px; top: 0; }
        #crosshair::after { width: 16px; height: 2px; left: 0; top: 7px; }
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0,0,0,0.5);
            z-index: 100;
        }
        .slot {
            width: 48px;
            height: 48px;
            background: rgba(139,139,139,0.8);
            border: 2px solid #373737;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slot.active {
            border-color: #fff;
            background: rgba(200,200,200,0.9);
        }
        .slot img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        .slot-num {
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: #fff;
            font-size: 12px;
            font-family: monospace;
            text-shadow: 1px 1px 0 #000;
        }
        #block-name {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
            z-index: 100;
            pointer-events: none;
        }
        #mode-indicator {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff5555;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            z-index: 100;
            pointer-events: none;
            font-weight: bold;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: monospace;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            z-index: 200;
            cursor: pointer;
        }
        #steve-hand {
            position: absolute;
            bottom: 0;
            left: 50%;
            margin-left: -128px;
            width: 256px;
            height: 256px;
            pointer-events: none;
            z-index: 50;
            image-rendering: pixelated;
            transform-origin: bottom center;
            transition: transform 0.1s;
        }
        #steve-hand.breaking {
            animation: hand-break 0.1s ease-in-out;
        }
        @keyframes hand-break {
            0% { transform: rotate(0deg) translateX(0); }
            50% { transform: rotate(-15deg) translateX(-20px); }
            100% { transform: rotate(0deg) translateX(0); }
        }
    </style>
</head>
